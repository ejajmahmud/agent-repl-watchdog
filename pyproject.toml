[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-repl-watchdog"
version = "0.1.0"
description = "Sandboxed interactive Python REPL session manager with strict timeout, memory limits, and state preservation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-repl-watchdog = "agent_repl_watchdog.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_repl_watchdog*"]
